name: 'WCAG / Section 508 Accessibility Checker'
type: module
description: 'WCAG 2.1 AA and Section 508 accessibility scanner. Provides a standalone admin form (axe-core + sandboxed iframe) for any Drupal site, and a paragraph component for headless Next.js setups using Playwright.'
core_version_requirement: ^10 || ^11
package: Accessibility
dependencies:
  - drupal:paragraphs
  - entity_reference_revisions:entity_reference_revisions
